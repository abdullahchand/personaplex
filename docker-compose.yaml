services:
  personaplex:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8998:8998"
    environment:
      - NO_TORCH_COMPILE=1
      # Optional: call-agent handoff URL. Persona POSTs multipart conversation.wav on session end.
      - HANDOFF_URL=${HANDOFF_URL:-}
      - HANDOFF_SHARED_SECRET=${HANDOFF_SHARED_SECRET:-}
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./.cache:/root/.cache
